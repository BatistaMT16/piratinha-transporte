services:
  db:
    image: postgres:16-alpine
    container_name: piratinha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-piratinha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-piratinha_secret_2026}
      POSTGRES_DB: ${DB_NAME:-piratinha_db}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - piratinha_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-piratinha} -d ${DB_NAME:-piratinha_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piratinha_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-piratinha}
      DB_PASSWORD: ${DB_PASSWORD:-piratinha_secret_2026}
      DB_NAME: ${DB_NAME:-piratinha_db}
      JWT_SECRET: ${JWT_SECRET:-piratinha_transporte_jwt_secret_2026}
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    container_name: piratinha_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  piratinha_pgdata:
    name: piratinha_pgdata
